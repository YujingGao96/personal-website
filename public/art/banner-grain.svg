<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <!-- Crisp ink speckles over a quieter, directional paper-fibre texture. -->
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" stitchTiles="stitch" seed="19" result="ink"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.32" numOctaves="2" stitchTiles="stitch" seed="31" result="fibres"/>
    <feComposite in="ink" in2="fibres" operator="arithmetic" k1="0" k2="0.82" k3="0.18" k4="0"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.8" intercept="-0.9"/>
      <feFuncG type="linear" slope="2.8" intercept="-0.9"/>
      <feFuncB type="linear" slope="2.8" intercept="-0.9"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>
